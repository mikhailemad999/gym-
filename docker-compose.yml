version: '3.8'

services:
  # ---- MySQL 8.0 ----
  mysql:
    image: mysql:8.0
    container_name: athletecare-mysql
    restart: unless-stopped
    ports:
      - "3305:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "1234"
      MYSQL_DATABASE: athletecare_pro
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p1234"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - athletecare-net

  # ---- Redis ----
  redis:
    image: redis:7-alpine
    container_name: athletecare-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - athletecare-net

  # ---- Backend (NestJS) ----
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: athletecare-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: "1234"
      DB_DATABASE: athletecare_pro
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    networks:
      - athletecare-net

  # ---- Worker (Bull Queue) ----
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: athletecare-worker
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    environment:
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: "1234"
      DB_DATABASE: athletecare_pro
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - athletecare-net

  # ---- Frontend (Next.js) ----
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: athletecare-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:3001/api/v1
    depends_on:
      - backend
    networks:
      - athletecare-net

  # ---- Nginx Reverse Proxy ----
  nginx:
    image: nginx:alpine
    container_name: athletecare-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - athletecare-net

volumes:
  mysql_data:
  redis_data:
  uploads:

networks:
  athletecare-net:
    driver: bridge
